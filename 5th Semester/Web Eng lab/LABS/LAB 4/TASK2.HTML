<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookstore Homepage</title>
    <link rel="stylesheet" href="styles2.css">
</head>
<body>
    <header>
        Welcome to ABC Bookstore
    </header>
    <section class="featured-books">
        <div class="book-category">
            <h3>The Great Gatsby</h3>
            <p>A classic novel by F. Scott Fitzgerald.</p>
            <button class="buy-now">Buy Now</button>
        </div>
        <div class="book-category">
            <h3>Sapiens: A Brief History of Humankind</h3>
            <p>An insightful book by Yuval Noah Harari.</p>
            <button class="buy-now">Buy Now</button>
        </div>
        <div class="book-category">
            <h3>Harry Potter and the Sorcerer's Stone</h3>
            <p>J.K. Rowling's magical world for kids.</p>
            <button class="buy-now">Buy Now</button>
        </div>
    </section>
</body>
</html>
