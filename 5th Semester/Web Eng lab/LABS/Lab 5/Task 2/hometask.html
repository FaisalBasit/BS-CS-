<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Agency</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Travel Agency</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Packages</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container py-5">
        <h2 class="text-center mb-4">Featured Destinations</h2>
        <div class="row">
            <div class="col-md-4 text-center">
                <img src="maldive.jpg" class="img-fluid rounded mb-3" alt="Destination 1">
                <h4>Maldives</h4>
                <p>Experience the serene beauty of the islands.</p>
            </div>
            <div class="col-md-4 text-center">
                <img src="paris.jpg" class="img-fluid rounded mb-3" alt="Destination 2">
                <h4>Paris</h4>
                <p>Discover the charm of the City of Light.</p>
            </div>
            <div class="col-md-4 text-center">
                <img src="japan.jpg" class="img-fluid rounded mb-3" alt="Destination 3">
                <h4>Japan</h4>
                <p>Explore the rich culture and modern marvels.</p>
            </div>
        </div>
    </div>
    <footer class="bg-light text-center py-4">
        <p><i class="fas fa-phone-alt"></i> +123 456 7890</p>
        <p><i class="fas fa-envelope"></i> info@travelagency.com</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
