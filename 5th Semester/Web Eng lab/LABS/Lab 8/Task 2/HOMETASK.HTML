<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Task - Product Catalog</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <style>
        .product {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px;
            border-radius: 5px;
            text-align: center;
            width: 200px;
        }
        .product img {
            width: 100px;
            height: 100px;
            object-fit: cover;
        }
        .catalog {
            display: flex;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <h1>Product Catalog</h1>
    <div>
        <label><input type="checkbox" class="categoryFilter" value="Electronics"> Electronics</label>
        <label><input type="checkbox" class="categoryFilter" value="Clothing"> Clothing</label>
    </div>
    <div class="catalog" id="productCatalog">
        <!-- Products will be displayed here -->
    </div>

    <script>
        $(document).ready(function () {
            // JSON product data
            const products = [
                { name: "Laptop", price: "$800", description: "High-performance laptop", category: "Electronics", imageUrl: "laptop.jpg", details: "16GB RAM, 512GB SSD" },
                { name: "Smartphone", price: "$500", description: "Latest smartphone", category: "Electronics", imageUrl: "phone.jpg", details: "128GB Storage, 5G" },
                { name: "T-Shirt", price: "$20", description: "Comfortable cotton T-shirt", category: "Clothing", imageUrl: "tshirt.jpg", details: "Available in various sizes" },
                { name: "Jeans", price: "$40", description: "Stylish blue jeans", category: "Clothing", imageUrl: "jeans.jpg", details: "Available in various sizes" },
            ];

            // Display products
            function displayProducts(categories = []) {
                $("#productCatalog").empty();
                const filteredProducts = categories.length === 0 
                    ? products 
                    : products.filter(product => categories.includes(product.category));
                filteredProducts.forEach(product => {
                    $("#productCatalog").append(
                        `<div class="product">
                            <img src="${product.imageUrl}" alt="${product.name}">
                            <h3>${product.name}</h3>
                            <p>${product.description}</p>
                            <p><strong>Price:</strong> ${product.price}</p>
                            <button class="detailsButton">Details</button>
                            <div class="productDetails" style="display: none;">
                                <p>${product.details}</p>
                            </div>
                        </div>`
                    );
                });
            }

            // Initial display
            displayProducts();

            // Filter by category
            $(".categoryFilter").change(function () {
                const selectedCategories = $(".categoryFilter:checked").map(function () {
                    return $(this).val();
                }).get();
                displayProducts(selectedCategories);
            });

            // Show details
            $(document).on("click", ".detailsButton", function () {
                $(this).next(".productDetails").slideToggle();
            });
        });
    </script>
</body>
</html>
