<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="header">
            <img src="/Images/f3-01.png" alt="Oxford Logo" class="logo">
            <h1></h1>
        </div>
        <div class="login-box">
            <h1>Log in to My SSUET Online</h1>
            <p>Logging-in adds a cookie to your computer.</p>
            <form action="#">
                <label for="username">User name:</label>
                <input type="text" id="username" name="username" required>

                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>

                <div class="remember-me">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Remember my details</label>
                </div>

                <button type="submit" class="login-button">Log in</button>
            </form>
            <a href="#" class="register">Register for an account</a>
            <a href="#" class="forgot-password">Forgot your password or user name?</a>
        </div>
        <footer>
            <p>These pages are part of Oxford Alumni Online.</p>
            <a href="#">Cookie info</a> |
            <a href="#">Privacy notice</a> |
            <a href="#">Terms and conditions</a>
        </footer>
    </div>
</body>
</html>
